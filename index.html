<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Scavenger Hunt</title>
<style>
  :root {
    --bg: #14121f;
    --card: #1f1c30;
    --accent: #ff6b6b;
    --accent2: #4ecdc4;
    --gold: #ffd166;
    --text: #f2f0f7;
    --muted: #8b87a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #221f36, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    text-align: center;
    padding: 32px 16px 20px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.8rem;
  }
  header .team-name {
    color: var(--accent2);
    font-weight: 700;
  }
  .stat-bar {
    max-width: 520px;
    margin: 16px auto 0;
    background: var(--card);
    border-radius: 16px;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .stat {
    text-align: center;
    flex: 1;
  }
  .stat .label { color: var(--muted); font-size: 0.75rem; display: block; }
  .stat .value { font-size: 1.3rem; font-weight: 800; color: var(--gold); }
  .stat .value.skips { color: var(--accent2); }

  #feedback {
    max-width: 520px;
    margin: 14px auto 0;
    padding: 0 16px;
    text-align: center;
    min-height: 20px;
    font-weight: 600;
  }
  #feedback.ok { color: var(--accent2); }
  #feedback.err { color: var(--accent); }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 10px 16px;
  }
  .section {
    background: var(--card);
    border-radius: 18px;
    padding: 28px 24px;
    margin-bottom: 18px;
    text-align: center;
  }
  .question-note {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .question-hint {
    font-size: 1.25rem;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .answer-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .answer-row select {
    flex: 1;
    min-width: 160px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: #14121f;
    color: var(--text);
    font-size: 1rem;
  }
  .answer-row select:focus { outline: none; border-color: var(--accent2); }
  .answer-row button {
    padding: 14px 22px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #1a1a1a;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
  }
  .answer-row button:hover { filter: brightness(1.1); }
  .skip-btn {
    margin-top: 16px;
    background: none;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .skip-btn:hover { color: var(--text); }
  .skip-btn:disabled {
    color: #4a4760;
    cursor: not-allowed;
    text-decoration: none;
  }

  .all-done {
    font-size: 1.2rem;
    line-height: 1.6;
  }

  .team-picker {
    max-width: 400px;
    margin: 60px auto;
    text-align: center;
    padding: 0 16px;
  }
  .team-picker button {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
  }
  .team-picker button:hover { background: var(--accent); color: #1a1a1a; }
  .config-warning {
    max-width: 520px;
    margin: 20px auto;
    padding: 14px 18px;
    background: #4a1f1f;
    border-radius: 12px;
    color: #ffcaca;
    font-size: 0.9rem;
    text-align: center;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--card);
    border-radius: 18px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .modal-card p {
    font-size: 1.05rem;
    margin: 0 0 20px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .modal-actions button {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .modal-actions .btn-confirm {
    background: var(--accent2);
    color: #0d1b1a;
  }
  .modal-actions .btn-cancel {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }
  .modal-actions button:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<div id="app"></div>

<script src="config.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const teamParam = params.get('team');
  const app = document.getElementById('app');
  const TOTAL_SKIPS = 3;

  const configuredApi = CONFIG.API_URL && !CONFIG.API_URL.includes('PASTE_YOUR');

  // ---- seeded shuffle so each team always gets the same random order ----
  function hashString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
    }
    return h >>> 0;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed) {
    const rand = mulberry32(seed);
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  if (!teamParam) {
    renderTeamPicker();
  } else {
    renderHunt(teamParam);
  }

  function renderTeamPicker() {
    app.innerHTML = `
      <div class="team-picker">
        <h1>🔎 Photo Scavenger Hunt</h1>
        <p style="color:var(--muted)">Pick your team to start (or use the link you were given):</p>
        ${CONFIG.TEAMS.map(t => `<button data-team="${t}">${t}</button>`).join('')}
      </div>
    `;
    app.querySelectorAll('button[data-team]').forEach(btn => {
      btn.addEventListener('click', () => {
        const url = new URL(window.location.href);
        url.searchParams.set('team', btn.dataset.team);
        window.location.href = url.toString();
      });
    });
  }

  function renderHunt(team) {
    const totalPhotos = CONFIG.NUM_PHOTOS;
    const allIds = Array.from({ length: totalPhotos }, (_, i) => i + 1);
    const seed = hashString(team);
    const baseOrder = seededShuffle(allIds, seed);

    const queueKey = 'queue_' + team;
    const skipsKey = 'skipsUsed_' + team;
    const hintCache = {}; // id -> hint text, fetched from the backend on demand

    // queue = this team's working order of NOT-YET-ANSWERED ids.
    // Skipping moves the front id to the back of this same array,
    // so skipped clues naturally come back around at the end.
    let queue = JSON.parse(localStorage.getItem(queueKey) || 'null') || baseOrder.slice();
    let skipsUsed = parseInt(localStorage.getItem(skipsKey) || '0', 10);
    let score = 0;
    let foundCount = 0;

    function saveQueue() {
      localStorage.setItem(queueKey, JSON.stringify(queue));
    }
    function saveSkips() {
      localStorage.setItem(skipsKey, String(skipsUsed));
    }

    if (!configuredApi) {
      app.innerHTML = `<div class="config-warning">⚠️ API_URL isn't set in config.js yet. Hints live on the backend now, so the site can't work until that's configured. See README.md.</div>`;
      return;
    }

    app.innerHTML = `
      <header>
        <h1>🔎 Photo Scavenger Hunt</h1>
        <div>Team: <span class="team-name">${team}</span></div>
      </header>
      <div class="stat-bar">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" id="scoreValue">0</span>
        </div>
        <div class="stat">
          <span class="label">Found</span>
          <span class="value" id="foundValue">0 / ${totalPhotos}</span>
        </div>
        <div class="stat">
          <span class="label">Skips left</span>
          <span class="value skips" id="skipsValue">${TOTAL_SKIPS}</span>
        </div>
      </div>
      <div id="feedback"></div>
      <main>
        <div class="section" id="questionSection"></div>
      </main>
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
          <p id="modalText"></p>
          <div class="modal-actions">
            <button class="btn-cancel" id="modalCancel">Cancel</button>
            <button class="btn-confirm" id="modalConfirm">Yes, submit</button>
          </div>
        </div>
      </div>
    `;

    const questionSection = document.getElementById('questionSection');

    function updateStats() {
      document.getElementById('scoreValue').textContent = score;
      document.getElementById('foundValue').textContent = `${foundCount} / ${totalPhotos}`;
      document.getElementById('skipsValue').textContent = Math.max(0, TOTAL_SKIPS - skipsUsed);
    }

    async function fetchHint(id) {
      if (hintCache[id]) return hintCache[id];
      const res = await fetch(`${CONFIG.API_URL}?action=hint&id=${id}`);
      const data = await res.json();
      hintCache[id] = data.hint || '(hint unavailable — try refreshing)';
      return hintCache[id];
    }

    async function renderQuestion() {
      if (queue.length === 0) {
        questionSection.innerHTML = `<div class="all-done">🎉 You've found every photo!<br>Thanks for playing.</div>`;
        return;
      }

      const currentId = queue[0];
      questionSection.innerHTML = `<div class="question-note">Loading your clue…</div>`;
      const hintText = await fetchHint(currentId);

      // Guard against the queue changing while the fetch was in flight
      // (e.g. a sync just removed this id because another device found it).
      if (queue[0] !== currentId) return;

      const skipsLeft = TOTAL_SKIPS - skipsUsed;
      const optionsHtml = allIds.map(id =>
        `<option value="${id}">${id}</option>`
      ).join('');

      questionSection.innerHTML = `
        <div class="question-note">Clue ${totalPhotos - queue.length + 1} of ${totalPhotos}</div>
        <div class="question-hint">${hintText}</div>
        <div class="answer-row">
          <select id="answerSelect">
            <option value="" disabled selected>Pick the number…</option>
            ${optionsHtml}
          </select>
          <button id="submitBtn">Submit</button>
        </div>
        <button class="skip-btn" id="skipBtn" ${skipsLeft <= 0 ? 'disabled' : ''}>
          ${skipsLeft > 0 ? `Skip this one for now (${skipsLeft} left)` : 'No skips left'}
        </button>
      `;

      document.getElementById('submitBtn').addEventListener('click', () => onSubmitClick(currentId));
      const skipBtn = document.getElementById('skipBtn');
      if (skipsLeft > 0) {
        skipBtn.addEventListener('click', () => {
          queue = queue.filter(id => id !== currentId);
          queue.push(currentId);
          skipsUsed += 1;
          saveQueue();
          saveSkips();
          updateStats();
          renderQuestion();
        });
      }
    }

    function onSubmitClick(shownId) {
      const select = document.getElementById('answerSelect');
      const val = select.value;
      if (!val) return;
      showModal(`Submit #${val} as your answer for this clue?`, () => attemptAnswer(parseInt(val, 10), shownId));
    }

    function showModal(text, onConfirm) {
      const overlay = document.getElementById('modalOverlay');
      const confirmBtn = document.getElementById('modalConfirm');
      const cancelBtn = document.getElementById('modalCancel');
      document.getElementById('modalText').textContent = text;
      overlay.classList.add('open');

      function cleanup() {
        overlay.classList.remove('open');
        confirmBtn.removeEventListener('click', confirmHandler);
        cancelBtn.removeEventListener('click', cancelHandler);
      }
      function confirmHandler() { cleanup(); onConfirm(); }
      function cancelHandler() { cleanup(); }

      confirmBtn.addEventListener('click', confirmHandler);
      cancelBtn.addEventListener('click', cancelHandler);
    }

    function showFeedback(msg, ok) {
      const fb = document.getElementById('feedback');
      fb.textContent = msg;
      fb.className = ok ? 'ok' : 'err';
      setTimeout(() => { fb.textContent = ''; fb.className = ''; }, 3000);
    }

    async function attemptAnswer(guess, shownId) {
      // Compare against the id that was actually on screen when the user
      // hit Submit — not a freshly-read queue[0], which could in theory
      // have shifted underneath them from a background sync.
      if (guess !== shownId) {
        queue = queue.filter(id => id !== shownId);
        saveQueue();
        showFeedback(`Wrong answer, no backsies.`, false);
        renderQuestion();
        return;
      }

      try {
        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ team, photo: guess })
        });
        const data = await res.json();

        queue = queue.filter(id => id !== shownId);
        saveQueue();
        showFeedback(`Correct! +${data.points || 0} pts`, true);
        await refreshFromServer();
        renderQuestion();
      } catch (err) {
        console.warn('Submit failed', err);
        showFeedback('Correct, but syncing failed — will retry automatically.', true);
        queue = queue.filter(id => id !== shownId);
        saveQueue();
        renderQuestion();
      }
    }

    async function refreshFromServer() {
      if (!configuredApi) return;
      try {
        const res = await fetch(`${CONFIG.API_URL}?action=state&team=${encodeURIComponent(team)}`);
        const data = await res.json();
        score = data.score || 0;
        const found = (data.found || []).map(String);
        foundCount = found.length;
        // Make sure anything the server says is found isn't still sitting in our queue
        // (covers teammates answering from another device).
        const foundSet = new Set(found);
        const before = queue[0];
        queue = queue.filter(id => !foundSet.has(String(id)));
        if (queue[0] !== before) {
          saveQueue();
          renderQuestion();
        }
        updateStats();
      } catch (err) {
        console.warn('State refresh failed', err);
      }
    }

    updateStats();
    refreshFromServer().then(renderQuestion);
    setInterval(refreshFromServer, 15000);
  }
})();
</script>
</body>
</html>
